<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Diario" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="icon-jellyroger-180.png" />
  <link rel="icon" type="image/png" href="icon-jellyroger-32.png" />
  <title>Diario Alimentare</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body, #root { height: 100%; margin: 0; background: #EFF3EC; }
    body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
    #app-switcher-bottom{
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 999;
      display: flex; font-family: -apple-system, sans-serif;
      box-shadow: 0 -1px 6px rgba(0,0,0,.15);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: #fff;
    }
    #app-switcher-bottom button{ flex:1; padding:12px 0; border:none; font-weight:700; font-size:13px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    var probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;bottom:0;left:0;height:env(safe-area-inset-bottom,0px);visibility:hidden;pointer-events:none;';
    document.body.appendChild(probe);
    var safeBottom = probe.offsetHeight || 0;
    document.body.removeChild(probe);
    window.__EXTRA_BOTTOM_INSET = 46 + safeBottom;
  </script>
  <script src="bundle.js"></script>
  <div id="app-switcher-bottom">
    <button onclick="location.href='index.html'" style="background:#1F5C52;color:#fff;">🍽 Dieta</button>
    <button onclick="location.href='palestra.html'" style="background:#EFF3EC;color:#1F5C52;">🏋 Palestra</button>
  </div>
</body>
</html>
