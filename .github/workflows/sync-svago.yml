name: Sincronizza attività Svago da Garmin

on:
  schedule:
    - cron: '0 5 * * *'   # ogni notte alle 05:00 UTC (~06:00/07:00 ora italiana)
  workflow_dispatch: {}     # permette anche l'avvio manuale dal tab Actions

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa dipendenze
        run: pip install garminconnect

      - name: Sincronizza da Garmin
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: python sync_svago.py

      - name: Salva il risultato nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add svago-data.json
          git diff --staged --quiet || git commit -m "Aggiorna dati Svago da Garmin"
          git pull --rebase origin main
          git push
