<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Palestra" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="icon-jellyroger-180.png" />
  <link rel="icon" type="image/png" href="icon-jellyroger-32.png" />
  <title>Scheda Allenamento</title>
  <style>
    html, body { height: 100%; margin: 0; background: #0d1626; overflow: hidden; }
    #app-frame { position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; border: none; }
    #app-switcher-bottom{
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 999;
      display: flex; font-family: 'Inter', -apple-system, sans-serif;
      box-shadow: 0 -1px 6px rgba(0,0,0,.4);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    #app-switcher-bottom button{ flex:1; padding:12px 0; border:none; font-weight:700; font-size:13px; }
  </style>
</head>
<body>
  <iframe id="app-frame" src="palestra-app.html"></iframe>
  <div id="app-switcher-bottom">
    <button onclick="location.href='index.html'" style="background:#16243d;color:#8ea0bf;">🍽 Dieta</button>
    <button onclick="location.href='palestra.html'" style="background:#ffcc33;color:#101a2c;">🏋 Palestra</button>
  </div>
  <script>
    var switcherH = document.getElementById('app-switcher-bottom').offsetHeight;
    document.getElementById('app-frame').style.bottom = switcherH + 'px';
  </script>
</body>
</html>
